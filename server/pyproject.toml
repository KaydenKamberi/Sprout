[project]
name = "sprout-server"
version = "0.1.0"
description = "Sprout API, database, simulator and learning model (spec sections 8-11)."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2,<3",
    "alembic",
    "pymysql",
    "cryptography",
    "pydantic>=2,<3",
    "argon2-cffi",
    "numpy",
    "apscheduler>=3,<4",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
