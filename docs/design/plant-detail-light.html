<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Sprout — plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --item-h: 64px; }
[data-theme="dark"] {
  --bg: #0F1F16; --sidebar: #14261B; --edge: #24402F;
  --text: #F2EDE4; --muted: #A3B5A7; --accent: #8FD694; --leaf2: #5FA96B;
  --block-a: #33261C; --block-a-edge: #4A382A;
  --block-b: #1C2B21; --block-b-edge: #2A4030;
  --ph: #223528; --ph-text: #7E9484;
}
[data-theme="light"] {
  --bg: #FFFFFF; --sidebar: #FBFAF6; --edge: #E4E0D5;
  --text: #2B2B26; --muted: #8A887C; --accent: #3E7C46; --leaf2: #79A681;
  --block-a: #8B5E3C; --block-a-edge: #7A5033;
  --block-b: #CFCDC7; --block-b-edge: #BDBBB4;
  --ph: #FFFFFF; --ph-text: #9A9890;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
header { height: 88px; display: grid; place-items: center; }
.logo { font-family: "Pacifico", cursive; font-size: 34px; color: var(--accent); }
.frame { display: flex; height: calc(100vh - 88px); }
.sidebar { width: 230px; flex: none; background: var(--sidebar); border-right: 1px solid var(--edge); position: relative; overflow: hidden; }
.vine { position: absolute; top: 0; left: 0; height: 100%; }
.vine .stem { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; opacity: 0.95; }
.vine .leaf .blade { fill: var(--leaf2); opacity: 0.8; stroke: none; }
.vine .leaf .vein { fill: none; stroke: var(--sidebar); stroke-width: 1.1; opacity: 0.7; }
.vine .leaf.current .blade { fill: var(--accent); opacity: 1; }
.vine .tendril { fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: 0.55; stroke-linecap: round; }
.menu { position: relative; padding-top: 26px; }
.menu a {
  display: flex; align-items: center; height: var(--item-h); padding-left: 76px;
  color: var(--muted); text-decoration: none; font: 500 15.5px "Inter", sans-serif; letter-spacing: 0.01em;
}
.menu a.current { color: var(--accent); font-weight: 600; }
.main { flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 8px 26px 26px; min-width: 0; }
.block-a { flex: 1.15; background: var(--block-a); border: 1px solid var(--block-a-edge); border-radius: 18px; display: grid; place-items: center; }
.block-b { flex: 1; background: var(--block-b); border: 1px solid var(--block-b-edge); border-radius: 18px; display: grid; place-items: center; }
.ph { background: var(--ph); border: 1.5px dashed var(--ph-text); border-radius: 12px; padding: 26px 44px; color: var(--ph-text); font: 500 15px "Inter", sans-serif; }
</style>
</head>
