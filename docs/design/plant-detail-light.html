<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Sprout — plant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --item-h: 64px; }
[data-theme="dark"] {
  --bg: #0F1F16; --sidebar: #14261B; --edge: #24402F;
  --text: #F2EDE4; --muted: #A3B5A7; --accent: #8FD694;
  --block-a: #33261C; --block-a-edge: #4A382A;
  --block-b: #1C2B21; --block-b-edge: #2A4030;
  --ph: #223528; --ph-text: #7E9484;
}
[data-theme="light"] {
  --bg: #FFFFFF; --sidebar: #FBFAF6; --edge: #E4E0D5;
  --text: #2B2B26; --muted: #8A887C; --accent: #3E7C46;
  --block-a: #8B5E3C; --block-a-edge: #7A5033;
  --block-b: #CFCDC7; --block-b-edge: #BDBBB4;
  --ph: #FFFFFF; --ph-text: #9A9890;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
header { height: 88px; display: grid; place-items: center; }
.logo { font-family: "Pacifico", cursive; font-size: 34px; color: var(--accent); }
.frame { display: flex; height: calc(100vh - 88px); }
.sidebar { width: 230px; flex: none; background: var(--sidebar); border-right: 1px solid var(--edge); position: relative; }
.vine { position: absolute; top: 0; left: 6px; }
.vine .stem { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; opacity: 0.9; }
.vine .leaf path { fill: var(--accent); opacity: 0.6; }
.vine .leaf.current path { opacity: 1; }
.vine .tendril { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0.5; }
.menu { position: relative; padding-top: 26px; }
.menu a {
  display: flex; align-items: center; height: var(--item-h); padding-left: 74px;
  color: var(--muted); text-decoration: none; font: 500 15.5px "Inter", sans-serif; letter-spacing: 0.01em;
}
.menu a.current { color: var(--accent); font-weight: 600; }
.main { flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 8px 26px 26px; min-width: 0; }
.block-a { flex: 1.15; background: var(--block-a); border: 1px solid var(--block-a-edge); border-radius: 18px; display: grid; place-items: center; }
.block-b { flex: 1; background: var(--block-b); border: 1px solid var(--block-b-edge); border-radius: 18px; display: grid; place-items: center; }
.ph { background: var(--ph); border: 1.5px dashed var(--ph-text); border-radius: 12px; padding: 26px 44px; color: var(--ph-text); font: 500 15px "Inter", sans-serif; }
</style>
</head>
<body>
<header><div class="logo">Sprout</div></header>
<div class="frame">
  <aside class="sidebar">
    <svg class="vine" width="90" height="446" viewBox="0 0 90 446"><polyline points="38.4,8.0 42.0,25.9 42.0,43.8 33.6,61.8 30.0,79.7 30.0,97.6 38.4,115.5 42.0,133.4 42.0,151.3 33.6,169.2 30.0,187.2 30.0,205.1 38.4,223.0 42.0,240.9 42.0,258.8 33.6,276.8 30.0,294.7 30.0,312.6 38.4,330.5 42.0,348.4 42.0,366.3 33.6,384.2 30.0,402.2 30.0,420.1 38.4,438.0" class="stem"/><g transform="translate(32 58) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(-1,1)"/></g><g transform="translate(40 58) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(1,1)"/></g><path class="tendril" d="M36,90 q 10,-4 8,-12 q -2,-6 6,-8"/><g transform="translate(32 122) rotate(24)" class="leaf current"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(-1,1)"/></g><g transform="translate(40 122) rotate(24)" class="leaf current"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(1,1)"/></g><path class="tendril" d="M36,154 q 10,-4 8,-12 q -2,-6 6,-8"/><g transform="translate(32 186) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(-1,1)"/></g><g transform="translate(40 186) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(1,1)"/></g><path class="tendril" d="M36,218 q 10,-4 8,-12 q -2,-6 6,-8"/><g transform="translate(32 250) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(-1,1)"/></g><g transform="translate(40 250) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(1,1)"/></g><path class="tendril" d="M36,282 q 10,-4 8,-12 q -2,-6 6,-8"/><g transform="translate(32 314) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(-1,1)"/></g><g transform="translate(40 314) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(1,1)"/></g><path class="tendril" d="M36,346 q 10,-4 8,-12 q -2,-6 6,-8"/><g transform="translate(32 378) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(-1,1)"/></g><g transform="translate(40 378) rotate(24)" class="leaf"><path d="M0,0 C7,-9 20,-9 27,0 C20,9 7,9 0,0 Z" transform="scale(1,1)"/></g></svg>
    <nav class="menu">
      <a href="#">Home</a>
      <a href="#" class="current">Plants</a>
      <a href="#">Devices</a>
      <a href="#">History</a>
      <a href="#">Account</a>
      <a href="#">Help</a>
    </nav>
  </aside>
  <main class="main">
    <div class="block-a"><div class="ph">Pic of plant</div></div>
    <div class="block-b"><div class="ph">Stats of plant</div></div>
  </main>
</div>
</body>
</html>
