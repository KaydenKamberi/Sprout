; Sprout stake firmware (spec 7.9, DEC-04).
; Every version is pinned. Change a version only through a pull request.

[platformio]
default_envs = seeed_xiao_esp32c3

; The real stake: Seeed XIAO ESP32-C3, Arduino-ESP32 core 3.x via the community pioarduino platform.
[env:seeed_xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; src/net_test/ belongs to the net_test environment below, not to the stake.
build_src_filter = +<*> -<net_test/>

; Checkpoint A2 / gate G2 network test (spec 3.5, 7.8, 14). A separate program, not the stake
; firmware: pick "env:net_test" in VS Code, then Upload. See firmware/README.md.
[env:net_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<net_test/>
; Mozilla root certificates, so HTTPS certificates are checked (spec 7.9). Built by certs/make_bundle.py.
board_build.embed_files = certs/x509_crt_bundle
lib_deps =
    bblanchon/ArduinoJson@7.4.2

; Laptop tests for everything in src/logic/ (no hardware needed):  pio test -e native
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1
build_flags = -std=c++17
